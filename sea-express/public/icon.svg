<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Town Hub">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC15E"/>
      <stop offset="1" stop-color="#F2855B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#warm)"/>
  <!-- soft sun -->
  <circle cx="386" cy="132" r="44" fill="#FFF1C9" opacity="0.9"/>
  <!-- cosy town: cream houses with teal roofs and warm doors -->
  <!-- left house -->
  <polygon points="84,300 150,236 216,300" fill="#0D6B7A"/>
  <rect x="96" y="300" width="108" height="104" rx="16" fill="#FFF7EC"/>
  <rect x="132" y="350" width="36" height="54" rx="8" fill="#F2855B"/>
  <!-- centre house (tall) -->
  <polygon points="182,250 256,180 330,250" fill="#0D6B7A"/>
  <rect x="196" y="250" width="120" height="154" rx="16" fill="#FFF7EC"/>
  <circle cx="256" cy="292" r="15" fill="#0D6B7A"/>
  <rect x="238" y="332" width="36" height="72" rx="8" fill="#F2855B"/>
  <!-- right house -->
  <polygon points="296,288 362,224 428,288" fill="#0D6B7A"/>
  <rect x="308" y="288" width="108" height="116" rx="16" fill="#FFF7EC"/>
  <circle cx="362" cy="330" r="14" fill="#0D6B7A"/>
</svg>
